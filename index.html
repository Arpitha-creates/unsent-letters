<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unsent — letters you'll never send</title>
<style>
  :root{
    --cream:#f6efe2; --cream2:#efe6d5; --ink:#3a332b; --muted:#9a8f7d; --line:#e4d9c6;
    --wax:#b4553f; --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden}
  body{
    background:
      radial-gradient(120% 80% at 50% -10%, #fdf8ee 0, transparent 55%),
      radial-gradient(100% 70% at 50% 115%, #eadfca 0, transparent 55%),
      var(--cream);
    color:var(--ink); font-family:var(--sans);
  }
  .grain{position:fixed;inset:0;pointer-events:none;opacity:.5;
    background-image:repeating-linear-gradient(0deg, rgba(120,100,70,.028) 0 1px, transparent 1px 3px);z-index:1}
  header{position:fixed;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;
    padding:20px 26px;z-index:20;pointer-events:none}
  .brand{pointer-events:auto}
  .brand h1{font-family:var(--serif);font-size:28px;margin:0;letter-spacing:.01em}
  .brand .k{font-size:10.5px;letter-spacing:.34em;text-transform:uppercase;color:var(--muted);margin-bottom:3px}
  .writebtn{pointer-events:auto;border:1px solid var(--ink);background:var(--ink);color:#fdf8ee;border-radius:999px;
    padding:11px 22px;font-size:13px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;cursor:pointer;
    transition:.16s;font-family:inherit}
  .writebtn:hover{background:#4a4137;transform:translateY(-1px);box-shadow:0 10px 24px rgba(60,50,35,.2)}
  #sea{position:fixed;inset:0;z-index:5}
  .paper{position:absolute;width:168px;height:112px;border-radius:3px;cursor:pointer;will-change:transform;
    box-shadow:0 10px 24px rgba(80,66,46,.16), 0 1px 0 rgba(255,255,255,.6) inset;
    transition:box-shadow .25s, filter .25s;overflow:hidden}
  .paper:hover{box-shadow:0 22px 44px rgba(80,66,46,.28);filter:brightness(1.02)}
  .paper .fold{position:absolute;top:0;right:0;width:0;height:0;
    border-top:26px solid rgba(0,0,0,.055); border-left:26px solid transparent}
  .paper .foldline{position:absolute;top:0;right:0;width:26px;height:26px;
    background:linear-gradient(135deg, rgba(255,255,255,.5), rgba(0,0,0,.05))}
  .paper .to{position:absolute;left:14px;top:30px;font-family:var(--serif);font-size:14px;color:#5c5245;max-width:120px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .paper .snip{position:absolute;left:14px;top:52px;right:16px;font-family:var(--serif);font-size:11.5px;color:#a99c88;
    line-height:1.4;max-height:44px;overflow:hidden}
  .paper .seal{position:absolute;right:12px;bottom:10px;width:15px;height:15px;border-radius:50%;background:var(--wax);
    box-shadow:0 1px 3px rgba(0,0,0,.3) inset, 0 1px 2px rgba(0,0,0,.2)}
  .empty{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    z-index:6;text-align:center;padding:30px;pointer-events:none}
  .empty h2{font-family:var(--serif);font-size:26px;margin:0 0 8px;color:#6b5f4e}
  .empty p{color:var(--muted);font-size:14.5px;max-width:340px;line-height:1.7;margin:0}
  .modal{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;padding:22px;
    background:rgba(58,48,35,.32);backdrop-filter:blur(4px);opacity:0;pointer-events:none;transition:.2s}
  .modal.show{opacity:1;pointer-events:auto}
  .sheet{background:linear-gradient(180deg,#fffdf8,#fbf6ec);border-radius:6px;width:100%;max-width:520px;
    max-height:88vh;overflow-y:auto;box-shadow:0 40px 90px rgba(60,48,32,.4);border:1px solid #efe6d6;
    transform:translateY(16px) scale(.98);transition:.24s cubic-bezier(.2,.8,.2,1)}
  .modal.show .sheet{transform:none}
  .sheet.read{padding:38px 40px}
  .sheet.compose{padding:30px 34px}
  .read .to-line{font-family:var(--serif);font-size:20px;margin-bottom:4px;color:#4a4137}
  .read .subj{font-family:var(--serif);font-size:24px;font-style:italic;color:#6b5f4e;margin:0 0 18px}
  .read .body{font-family:var(--serif);font-size:16.5px;line-height:1.85;color:#463d33;white-space:pre-wrap;word-break:break-word}
  .read .date{margin-top:24px;color:var(--muted);font-size:12.5px;letter-spacing:.08em;text-transform:uppercase}
  .read .rule{height:1px;background:var(--line);margin:18px 0 22px}
  .actions{display:flex;gap:10px;margin-top:26px;flex-wrap:wrap}
  .mb{border:1px solid var(--line);background:transparent;color:#6b5f4e;border-radius:999px;padding:9px 18px;
    font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;transition:.14s}
  .mb:hover{background:#f3ece0;border-color:#d8cbb4}
  .mb.danger{color:#a34a3a;border-color:#e8cdc6}
  .mb.danger:hover{background:#f8ece8}
  .compose h2{font-family:var(--serif);font-size:22px;margin:0 0 18px;color:#4a4137}
  .lbl{font-size:10.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--muted);margin-bottom:6px;display:block}
  .input{width:100%;font-family:var(--serif);font-size:16px;padding:11px 13px;border:1px solid var(--line);
    border-radius:8px;background:#fffdf8;color:var(--ink);margin-bottom:16px}
  .input:focus{outline:2px solid #d9c9a8;outline-offset:1px;border-color:#d9c9a8}
  textarea.input{resize:vertical;min-height:150px;line-height:1.7}
  .sendrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .primary{background:var(--wax);color:#fff;border:none;border-radius:999px;padding:12px 26px;font-size:13.5px;
    font-weight:700;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;font-family:inherit;transition:.15s}
  .primary:hover{background:#9c4634;transform:translateY(-1px);box-shadow:0 10px 22px rgba(150,60,40,.3)}
  .note{color:var(--muted);font-size:12px;margin-left:auto;font-style:italic;font-family:var(--serif)}
  .hint{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);color:var(--muted);font-size:12px;
    z-index:20;letter-spacing:.04em;pointer-events:none;text-align:center;width:100%}
  .toast{position:fixed;bottom:52px;left:50%;transform:translateX(-50%) translateY(20px);background:#4a4137;color:#fdf8ee;
    padding:11px 20px;border-radius:999px;font-size:13.5px;opacity:0;transition:.25s;pointer-events:none;z-index:60;font-family:var(--serif)}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  @media(max-width:560px){
    header{padding:16px 16px}
    .brand h1{font-size:23px}
    .sheet.read{padding:28px 24px}
    .sheet.compose{padding:24px 20px}
    .paper{width:140px;height:96px}
  }
</style>
</head>
<body>
<div class="grain"></div>
<header>
  <div class="brand">
    <div class="k">letters you'll never send</div>
    <h1>Unsent</h1>
  </div>
  <button class="writebtn" id="writeBtn">Write</button>
</header>

<div id="sea"></div>

<div class="empty" id="empty">
  <h2>Nothing here yet.</h2>
  <p>Write the first letter you'll never send — the one you keep drafting in your head. It stays here, on this device, and drifts quietly.</p>
</div>

<div class="hint" id="hint"></div>

<!-- read modal -->
<div class="modal" id="readModal">
  <div class="sheet read" id="readSheet"></div>
</div>

<!-- compose modal -->
<div class="modal" id="composeModal">
  <div class="sheet compose">
    <h2>Write a letter</h2>
    <label class="lbl" for="toField">To</label>
    <input class="input" id="toField" placeholder="Their name — or leave it blank" autocomplete="off">
    <label class="lbl" for="subjField">Subject</label>
    <input class="input" id="subjField" placeholder="A line to remember it by" autocomplete="off">
    <label class="lbl" for="bodyField">The letter</label>
    <textarea class="input" id="bodyField" placeholder="Say everything you've been holding…"></textarea>
    <div class="sendrow">
      <button class="primary" id="saveBtn">Keep it unsent</button>
      <button class="mb" id="cancelBtn">Cancel</button>
      <span class="note">only you will ever read this</span>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  "use strict";
  var KEY="unsent.v1";
  var sea=document.getElementById("sea");
  var $=function(id){ return document.getElementById(id); };
  var PAPER_COLORS=["#fffdf6","#fdf3e7","#f6f0e2","#f8eae6","#eef1ea","#f5f0f8","#fdf7ea"];

  function uid(){ return Math.random().toString(36).slice(2,9); }
  function esc(s){ return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
  function toast(m){ var t=$("toast"); t.textContent=m; t.classList.add("show"); setTimeout(function(){t.classList.remove("show");},1800); }

  var letters=load();
  function load(){ try{ var r=localStorage.getItem(KEY); if(r){ var s=JSON.parse(r); if(Array.isArray(s)) return s; } }catch(e){} return seed(); }
  function save(){ try{ localStorage.setItem(KEY, JSON.stringify(letters)); }catch(e){} }
  function seed(){
    return [{
      id:uid(), to:"the version of me who was scared",
      subject:"You were braver than you knew",
      body:"I keep meaning to tell you this.\n\nEverything you were afraid would break you — it didn't. It bent you, a little, and then you kept going anyway. That was the whole thing. Not the big brave moments. The small ordinary ones, on the days nobody was watching.\n\nI'm proud of you. I should have said it sooner.",
      created: Date.now()-1000*60*60*26, color:"#fdf3e7"
    }];
  }

  /* ---------------- floating papers ---------------- */
  var nodes=[]; // {el, l, fx, fy, ax, ay, phase, speed, rot, spin}
  var seaW=0, seaH=0;
  function measure(){ var r=sea.getBoundingClientRect(); seaW=r.width; seaH=r.height; }
  window.addEventListener("resize",function(){ measure(); layoutPositions(); });

  function build(){
    sea.innerHTML=""; nodes=[];
    var n=letters.length;
    letters.forEach(function(l,i){
      var el=document.createElement("div");
      el.className="paper";
      el.style.background = l.color || PAPER_COLORS[i%PAPER_COLORS.length];
      var toLine = l.to ? "To "+l.to : "To —";
      el.innerHTML = '<div class="foldline"></div><div class="fold"></div>'+
        '<div class="to">'+esc(toLine)+'</div>'+
        '<div class="snip">'+esc((l.body||"").slice(0,60))+'</div>'+
        '<div class="seal"></div>';
      el.addEventListener("click",function(){ openRead(l); });
      sea.appendChild(el);
      nodes.push({ el:el, l:l, seed: Math.random()*100, });
    });
    layoutPositions();
    $("empty").style.display = letters.length? "none":"flex";
    $("hint").textContent = letters.length? (letters.length+" letter"+(letters.length>1?"s":"")+" · tap one to read") : "";
  }

  function layoutPositions(){
    measure();
    var cols=Math.max(1, Math.min(4, Math.round(seaW/230)));
    if(nodes.length<=2) cols=nodes.length||1; // centre one or two letters
    var rows=Math.max(1, Math.ceil(nodes.length/cols));
    nodes.forEach(function(nd,i){
      var col=i%cols, row=Math.floor(i/cols);
      var fx=(col+0.5)/cols, fy=(row+0.55)/Math.max(1,rows);
      nd.fx=fx; nd.fy=fy;
      // scatter
      nd.jx=(Math.random()-0.5)*Math.min(90, seaW/cols*0.5);
      nd.jy=(Math.random()-0.5)*46;
      nd.ax=14+Math.random()*22; nd.ay=12+Math.random()*18;
      nd.phase=Math.random()*Math.PI*2; nd.speed=0.14+Math.random()*0.18;
      nd.rot=(Math.random()-0.5)*10; nd.spin=(Math.random()-0.5)*2.4;
    });
  }

  function frame(t){
    var tt=t/1000;
    var padX=90, padY=70;
    nodes.forEach(function(nd){
      var baseX = nd.fx*(seaW-padX*2)+padX + nd.jx;
      var baseY = nd.fy*(seaH-padY*2)+padY + nd.jy;
      var x = baseX + Math.sin(tt*nd.speed + nd.phase)*nd.ax;
      var y = baseY + Math.cos(tt*nd.speed*0.82 + nd.phase*1.3)*nd.ay;
      var r = nd.rot + Math.sin(tt*nd.speed*0.6 + nd.phase)*nd.spin;
      nd.el.style.transform = "translate("+x.toFixed(1)+"px,"+y.toFixed(1)+"px) rotate("+r.toFixed(2)+"deg)";
    });
    requestAnimationFrame(frame);
  }

  /* ---------------- read ---------------- */
  function openRead(l){
    var sheet=$("readSheet");
    var d=new Date(l.created);
    sheet.innerHTML =
      '<div class="to-line">'+(l.to?("To "+esc(l.to)):"To —")+'</div>'+
      (l.subject?('<div class="subj">'+esc(l.subject)+'</div>'):'')+
      '<div class="rule"></div>'+
      '<div class="body">'+esc(l.body||"")+'</div>'+
      '<div class="date">'+d.toLocaleDateString(undefined,{day:'numeric',month:'long',year:'numeric'})+'</div>'+
      '<div class="actions">'+
        '<button class="mb" id="closeRead">Close</button>'+
        '<button class="mb danger" id="delRead">Let it go</button>'+
      '</div>';
    $("readModal").classList.add("show");
    $("closeRead").onclick=closeRead;
    $("delRead").onclick=function(){
      if(confirm("Delete this letter for good? It can't be recovered.")){
        letters=letters.filter(function(z){ return z.id!==l.id; });
        save(); closeRead(); build(); toast("Let go");
      }
    };
  }
  function closeRead(){ $("readModal").classList.remove("show"); }
  $("readModal").addEventListener("click",function(e){ if(e.target===this) closeRead(); });

  /* ---------------- compose ---------------- */
  function openCompose(){
    $("toField").value=""; $("subjField").value=""; $("bodyField").value="";
    $("composeModal").classList.add("show");
    setTimeout(function(){ $("toField").focus(); },80);
  }
  function closeCompose(){ $("composeModal").classList.remove("show"); }
  $("writeBtn").onclick=openCompose;
  $("cancelBtn").onclick=closeCompose;
  $("composeModal").addEventListener("click",function(e){ if(e.target===this) closeCompose(); });
  $("saveBtn").onclick=function(){
    var body=$("bodyField").value.trim();
    if(!body){ toast("Write something first"); return; }
    letters.unshift({
      id:uid(),
      to:$("toField").value.trim(),
      subject:$("subjField").value.trim(),
      body:body,
      created:Date.now(),
      color:PAPER_COLORS[Math.floor(Math.random()*PAPER_COLORS.length)]
    });
    save(); closeCompose(); build();
    toast("Kept, unsent");
  };
  document.addEventListener("keydown",function(e){
    if(e.key==="Escape"){ closeRead(); closeCompose(); }
    if((e.ctrlKey||e.metaKey) && e.key==="Enter" && $("composeModal").classList.contains("show")) $("saveBtn").click();
  });

  /* ---------------- boot ---------------- */
  build();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
